<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#07111f"><title>فيزياء مصر 2027 PRO</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:linear-gradient(135deg,#050b15,#09182a);color:#fff}header{position:sticky;top:0;z-index:5;padding:14px 4%;background:#050b15ee;border-bottom:1px solid #ffffff14;display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900}.logo span{color:#42d9a0}button,input{font:inherit}button{cursor:pointer}.container{width:92%;max-width:1150px;margin:auto}.hero{text-align:center;padding:45px 8px 25px}.hero h1{font-size:clamp(36px,9vw,70px);margin:0 0 12px;background:linear-gradient(90deg,#fff,#4aa8ff,#42d9a0);-webkit-background-clip:text;color:transparent}.hero p{color:#9eb0c8;line-height:2}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}.stat,.card{background:linear-gradient(145deg,#10243d,#0b192b);border:1px solid #ffffff14;border-radius:18px}.stat{text-align:center;padding:15px}.stat b{display:block;color:#42d9a0;font-size:24px}.stat span,.desc,.steps{color:#9eb0c8;font-size:13px}.search input{width:100%;padding:16px;background:#071322;color:#fff;border:1px solid #ffffff14;border-radius:14px;outline:0;margin:15px 0}.tabs{display:flex;gap:8px;overflow:auto;padding:5px 0 15px}.tabs button{white-space:nowrap;padding:10px 14px;border:1px solid #ffffff14;border-radius:12px;background:#0b192b;color:#fff}.tabs button.active{background:linear-gradient(135deg,#4aa8ff,#42d9a0);color:#03131a}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:14px}.card{padding:18px}.law{position:relative}.law h3{padding-left:35px}.formula{text-align:center;direction:ltr;color:#42d9a0;font-size:24px;font-weight:900;padding:12px}.fav{position:absolute;left:12px;top:12px;border:0;background:#ffffff09;color:#ffd75a;border-radius:9px;width:32px;height:32px}.use{width:100%;margin-top:13px;padding:11px;border:0;border-radius:11px;background:#ffffff0b;color:#fff}.meta{display:flex;justify-content:space-between;border-top:1px solid #ffffff12;margin-top:12px;padding-top:10px;color:#8297b0;font-size:11px}.calc{margin:28px 0}.selected,.result{background:#071322;border:1px solid #ffffff12;border-radius:14px;padding:15px}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin-top:12px}.field label{display:block;color:#9eb0c8;font-size:12px;margin-bottom:6px}.field input{width:100%;padding:13px;background:#071322;color:#fff;border:1px solid #ffffff14;border-radius:11px;outline:0}.actions{display:flex;gap:9px;margin-top:14px}.primary,.clear{border:0;border-radius:12px;padding:13px 19px;font-weight:bold}.primary{background:linear-gradient(135deg,#4aa8ff,#42d9a0);color:#03131a}.clear{background:#12243d;color:#fff}.result{text-align:center;margin-top:15px}.result strong{display:block;color:#42d9a0;font-size:31px;margin:8px}.empty{text-align:center;padding:40px;color:#9eb0c8}.headbtn{width:40px;height:40px;border:1px solid #ffffff14;background:#ffffff09;color:#fff;border-radius:11px}footer{text-align:center;color:#71859e;padding:30px;border-top:1px solid #ffffff0b;margin-top:40px;line-height:2}@media(max-width:650px){.stats{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.actions{flex-direction:column}.actions button{width:100%}}</style></head><body><header><div class="logo">⚡ فيزياء <span>مصر 2027 PRO</span></div><button class="headbtn" id="theme">🌙</button></header><main class="container"><section class="hero"><h1>فيزياء مصر 2027</h1><p>موسوعة قوانين فيزياء عربية مع حاسبة ذكية، بحث، تصنيفات ومفضلة. مصممة للعمل داخل تطبيقات WebView مثل AppCreator24.</p></section><section class="stats"><div class="stat"><b id="count">0</b><span>قانون</span></div><div class="stat"><b id="favCount">0</b><span>مفضلة</span></div><div class="stat"><b>2027</b><span>الإصدار</span></div></section><div class="search"><input id="search" type="search" placeholder="🔎 ابحث: نيوتن، أوم، طاقة، موجة..."></div><div class="tabs" id="tabs"><button class="active" data-cat="all">الكل</button><button data-cat="motion">الحركة</button><button data-cat="mechanics">الميكانيكا</button><button data-cat="energy">الطاقة</button><button data-cat="electric">الكهرباء</button><button data-cat="waves">الموجات</button><button data-cat="heat">الحرارة</button><button data-cat="optics">الضوء</button><button data-cat="modern">الحديثة</button><button data-cat="university">جامعي</button></div><div id="cards" class="grid"></div><section class="card calc"><h2>🧮 الحاسبة الذكية</h2><div class="selected"><div id="formula" class="formula">v = d ÷ t</div><strong id="name">السرعة</strong></div><div id="fields" class="fields"></div><div class="actions"><button class="primary" id="calc">⚡ احسب</button><button class="clear" id="clear">مسح</button></div><div class="result"><span>النتيجة</span><strong id="result">—</strong><div id="steps" class="steps">أدخل القيم المطلوبة.</div></div></section></main><footer>⚡ فيزياء مصر 2027 PRO<br>منصة تعليمية تجريبية 🇪🇬</footer><script>
const laws=[
['السرعة','motion','v = d ÷ t','السرعة = المسافة ÷ الزمن.',[['d','المسافة','m'],['t','الزمن','s']],'m/s',v=>v.d/v.t,v=>`v = ${v.d} ÷ ${v.t}`],
['العجلة','motion','a = Δv ÷ t','العجلة = التغير في السرعة ÷ الزمن.',[['dv','التغير في السرعة','m/s'],['t','الزمن','s']],'m/s²',v=>v.dv/v.t,v=>`a = ${v.dv} ÷ ${v.t}`],
['الإزاحة','motion','d = v × t','الإزاحة عند سرعة ثابتة.',[['v','السرعة','m/s'],['t','الزمن','s']],'m',v=>v.v*v.t,v=>`d = ${v.v} × ${v.t}`],
['السرعة النهائية','motion','v = u + at','السرعة النهائية عند عجلة ثابتة.',[['u','السرعة الابتدائية','m/s'],['a','العجلة','m/s²'],['t','الزمن','s']],'m/s',v=>v.u+v.a*v.t,v=>`v = ${v.u} + (${v.a} × ${v.t})`],
['قانون نيوتن الثاني','mechanics','F = ma','القوة = الكتلة × العجلة.',[['m','الكتلة','kg'],['a','العجلة','m/s²']],'N',v=>v.m*v.a,v=>`F = ${v.m} × ${v.a}`],
['الوزن','mechanics','W = mg','وزن الجسم بالقرب من سطح الأرض.',[['m','الكتلة','kg'],['g','عجلة الجاذبية','m/s²']],'N',v=>v.m*v.g,v=>`W = ${v.m} × ${v.g}`],
['الكثافة','mechanics','ρ = m ÷ V','الكثافة = الكتلة ÷ الحجم.',[['m','الكتلة','kg'],['V','الحجم','m³']],'kg/m³',v=>v.m/v.V,v=>`ρ = ${v.m} ÷ ${v.V}`],
['الضغط','mechanics','P = F ÷ A','الضغط = القوة ÷ المساحة.',[['F','القوة','N'],['A','المساحة','m²']],'Pa',v=>v.F/v.A,v=>`P = ${v.F} ÷ ${v.A}`],
['الشغل','energy','W = Fd','الشغل = القوة × الإزاحة.',[['F','القوة','N'],['d','الإزاحة','m']],'J',v=>v.F*v.d,v=>`W = ${v.F} × ${v.d}`],
['الطاقة الحركية','energy','KE = ½mv²','طاقة الحركة.',[['m','الكتلة','kg'],['v','السرعة','m/s']],'J',v=>.5*v.m*v.v**2,v=>`KE = ½ × ${v.m} × ${v.v}²`],
['طاقة الوضع','energy','PE = mgh','طاقة الوضع قرب سطح الأرض.',[['m','الكتلة','kg'],['g','عجلة الجاذبية','m/s²'],['h','الارتفاع','m']],'J',v=>v.m*v.g*v.h,v=>`PE = ${v.m} × ${v.g} × ${v.h}`],
['القدرة','energy','P = W ÷ t','القدرة = الشغل ÷ الزمن.',[['W','الشغل','J'],['t','الزمن','s']],'W',v=>v.W/v.t,v=>`P = ${v.W} ÷ ${v.t}`],
['الزخم','energy','p = mv','كمية حركة الجسم.',[['m','الكتلة','kg'],['v','السرعة','m/s']],'kg·m/s',v=>v.m*v.v,v=>`p = ${v.m} × ${v.v}`],
['قانون أوم','electric','V = IR','فرق الجهد = التيار × المقاومة.',[['I','شدة التيار','A'],['R','المقاومة','Ω']],'V',v=>v.I*v.R,v=>`V = ${v.I} × ${v.R}`],
['القدرة الكهربية','electric','P = VI','القدرة الكهربية.',[['V','فرق الجهد','V'],['I','شدة التيار','A']],'W',v=>v.V*v.I,v=>`P = ${v.V} × ${v.I}`],
['الشحنة الكهربية','electric','Q = It','الشحنة = التيار × الزمن.',[['I','شدة التيار','A'],['t','الزمن','s']],'C',v=>v.I*v.t,v=>`Q = ${v.I} × ${v.t}`],
['قانون الموجة','waves','v = fλ','سرعة الموجة = التردد × الطول الموجي.',[['f','التردد','Hz'],['λ','الطول الموجي','m']],'m/s',v=>v.f*v.λ,v=>`v = ${v.f} × ${v.λ}`],
['التردد','waves','f = 1 ÷ T','التردد = مقلوب الزمن الدوري.',[['T','الزمن الدوري','s']],'Hz',v=>1/v.T,v=>`f = 1 ÷ ${v.T}`],
['الحرارة المكتسبة','heat','Q = mcΔT','كمية الحرارة المكتسبة أو المفقودة.',[['m','الكتلة','kg'],['c','الحرارة النوعية','J/kg·K'],['ΔT','التغير الحراري','K']],'J',v=>v.m*v.c*v.ΔT,v=>`Q = ${v.m} × ${v.c} × ${v.ΔT}`],
['قانون الانعكاس','optics','θᵢ = θᵣ','زاوية السقوط تساوي زاوية الانعكاس.',[['θi','زاوية السقوط','°']],'°',v=>v.θi,v=>`θᵣ = ${v.θi}°`],
['طاقة الفوتون','modern','E = hf','طاقة الفوتون = ثابت بلانك × التردد.',[['h','ثابت بلانك','J·s'],['f','التردد','Hz']],'J',v=>v.h*v.f,v=>`E = ${v.h} × ${v.f}`],
['تكافؤ الكتلة والطاقة','modern','E = mc²','العلاقة بين الكتلة والطاقة.',[['m','الكتلة','kg'],['c','سرعة الضوء','m/s']],'J',v=>v.m*v.c**2,v=>`E = ${v.m} × ${v.c}²`],
['قوة كولوم','university','F = kq₁q₂ ÷ r²','القوة الكهربية بين شحنتين.',[['k','ثابت كولوم','N·m²/C²'],['q1','الشحنة الأولى','C'],['q2','الشحنة الثانية','C'],['r','المسافة','m']],'N',v=>v.k*v.q1*v.q2/v.r**2,v=>`F = (${v.k} × ${v.q1} × ${v.q2}) ÷ ${v.r}²`],
['طاقة النابض','university','U = ½kx²','طاقة الوضع المرونية.',[['k','ثابت النابض','N/m'],['x','الإزاحة','m']],'J',v=>.5*v.k*v.x**2,v=>`U = ½ × ${v.k} × ${v.x}²`]
];
let current=laws[0],cat='all',favs=JSON.parse(localStorage.getItem('physics_favs')||'[]'),favOnly=false;
const $=id=>document.getElementById(id); const fmt=n=>Math.abs(n)>=1e9||Math.abs(n)>0&&Math.abs(n)<1e-6?n.toExponential(6):Number(n.toFixed(8)).toLocaleString('ar-EG');
function isFav(n){return favs.includes(n)} function save(){localStorage.setItem('physics_favs',JSON.stringify(favs));$('favCount').textContent=favs.length}
function render(){let q=$('search').value.trim().toLowerCase();let list=laws.filter(x=>(cat==='all'||x[1]===cat)&&(!favOnly||isFav(x[0]))&&(!q||(x[0]+' '+x[2]+' '+x[3]).toLowerCase().includes(q)));$('cards').innerHTML='';if(!list.length){$('cards').innerHTML='<div class="empty">🔎<br><br>لا توجد نتائج مطابقة.</div>';return}list.forEach(x=>{let e=document.createElement('article');e.className='card law';e.innerHTML=`<button class="fav">${isFav(x[0])?'★':'☆'}</button><h3>${x[0]}</h3><div class="formula">${x[2]}</div><div class="desc">${x[3]}</div><div class="meta"><span>${x[4].length} مدخل</span><span>${x[5]}</span></div><button class="use">🧮 استخدام القانون</button>`;e.querySelector('.fav').onclick=()=>{favs=isFav(x[0])?favs.filter(n=>n!==x[0]):[...favs,x[0]];save();render()};e.querySelector('.use').onclick=()=>select(x);$('cards').appendChild(e)})}
function select(x){current=x;$('name').textContent=x[0];$('formula').textContent=x[2];$('fields').innerHTML='';x[4].forEach(a=>{let d=document.createElement('div');d.className='field';d.innerHTML=`<label>${a[1]}${a[2]?' ('+a[2]+')':''}</label><input type="number" step="any" data-key="${a[0]}" placeholder="أدخل ${a[1]}">`;$('fields').appendChild(d)});$('result').textContent='—';$('steps').textContent='أدخل القيم المطلوبة ثم اضغط احسب.';document.querySelector('.calc').scrollIntoView({behavior:'smooth'})}
$('tabs').onclick=e=>{if(e.target.tagName!=='BUTTON')return;document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));e.target.classList.add('active');cat=e.target.dataset.cat;favOnly=false;render()};$('search').oninput=render;$('calc').onclick=()=>{let v={};for(let i of $('fields').querySelectorAll('input')){if(i.value.trim()===''){ $('result').textContent='⚠️';$('steps').textContent='أدخل جميع القيم المطلوبة.';return}v[i.dataset.key]=Number(i.value)}try{let r=current[6](v);if(!Number.isFinite(r))throw 0;$('result').textContent=fmt(r)+' '+current[5];$('steps').innerHTML='<b>خطوات الحل:</b><br>'+current[7](v)+'<br><b>النتيجة:</b> '+fmt(r)+' '+current[5]}catch(e){$('result').textContent='⚠️';$('steps').textContent='تأكد من القيم المدخلة.'}};$('clear').onclick=()=>{$('fields').querySelectorAll('input').forEach(i=>i.value='');$('result').textContent='—';$('steps').textContent='أدخل القيم المطلوبة ثم اضغط احسب.'};$('favorites').onclick=()=>{favOnly=!favOnly;render()};$('theme').onclick=()=>{document.body.classList.toggle('light');if(document.body.classList.contains('light')){document.body.style.background='linear-gradient(135deg,#eef4fa,#fff)';document.body.style.color='#101820';$('theme').textContent='☀️'}else{document.body.style.background='linear-gradient(135deg,#050b15,#09182a)';document.body.style.color='#fff';$('theme').textContent='🌙'}};$('count').textContent=laws.length;save();select(current);render();
</script></body></html>
